<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Rendering Algo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <b>Pixel grid test</b><br>
  </div>

<script>

  //we add shapes (like lines) to this canvas
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

 

  let camera = {x: 0, y: 0.5, z: -12.01};

  const rows = 200;
  const cols = 320;
  const pixelGrid = Array.from({ length: cols }, () => Array(rows).fill("#050510"));

  const CanvasScale = 4; // *5 was too big for my screen, so I change the code to make it more flexible

  canvas.width = cols * CanvasScale;
  canvas.height = rows * CanvasScale;

  let seePixelOutline = false; 


  const cube = {
    vertices: [
      { x:  1,  y: 1,  z: 1},   // A, idx 0
      { x: -1,  y: 1,  z: 1},   // B, idx 1
      { x:  1,  y: -1, z: 1},   // C, idx 2
      { x: -1,  y: -1, z:  1},  // D, idx 3
      { x:  1,  y: 1,  z: -1},  // E, idx 4
      { x: -1,  y: 1,  z: -1},  // F, idx 5
      { x:  1,  y: -1, z: -1}, // G, idx 6
      { x: -1,  y: -1, z: -1}   // H, idx 7
    ],

    edges: [
      [0, 1], //AB
      [0, 2], //AC
      [0, 4], //AE
      [2, 3], //CD
      [1, 3], //BD
      [2, 6], //CG
      [4, 5], //EF
      [4, 6], //EG
      [1, 5], //BF
      [6, 7], //GH
      [5, 7], //FH
      [3, 7], //DH
    ]
  }

  const light_post_left = {
    vertices: [
      { x: 0, y: -1, z: 0 },
      { x: 0, y: 0.9, z: 0 },
      { x: 0.2, y: 1, z: 0 },
      { x: 0.1, y: 0.9, z: 0.1 },
      { x: 0.1, y: 0.9, z: -0.1 },
      { x: 0.3, y: 0.9, z: -0.1 },
      { x: 0.3, y: 0.9, z: 0.1 },
    ],

    edges: [
      [0, 1],
      [1, 2],
      [2, 3],
      [2, 4],
      [2, 5],
      [2, 6],
      [3, 4],
      [4, 5],
      [5, 6],
      [6, 3],
    ],

    color: "#FFFFFF"
  }

  const light_post_right = {
    vertices: [
      { x: 0, y: -1, z: 0 },
      { x: 0, y: 0.9, z: 0 },
      { x: -0.2, y: 1, z: 0 },
      { x: -0.1, y: 0.9, z: 0.1 },
      { x: -0.1, y: 0.9, z: -0.1 },
      { x: -0.3, y: 0.9, z: -0.1 },
      { x: -0.3, y: 0.9, z: 0.1 },
    ],

    edges: [
      [0, 1],
      [1, 2],
      [2, 3],
      [2, 4],
      [2, 5],
      [2, 6],
      [3, 4],
      [4, 5],
      [5, 6],
      [6, 3],
    ],

    color: "#FFFFFF"
  }

  const square_mountain = {
    vertices: [
      { x: 0, y: 1, z: 0 },
      { x: -1, y: -1, z: 1 },
      { x: 1, y: -1, z: 1 },
      { x: 1, y: -1, z: -1 },
      { x: -1, y: -1, z: -1 },

    ],

    edges: [
      [0, 1],
      [0, 2],
      [0, 3],
      [0, 4],
      [1, 2],
      [2, 3],
      [3, 4],
      [4, 1],
    ],

    color: "#336633"
  }
  
  const triangle_mountain = {
    vertices: [
      { x: 0, y: 1, z: 0 },
      { x: -0.6, y: -1, z: 1 },
      { x: 0.87, y: -1, z: -0.5 },
      { x: -0.87, y: -1, z: -0.5 },
    ],

    edges: [
      [0, 1],
      [0, 2],
      [0, 3],
      [1, 2],
      [2, 3],
      [3, 1],
    ],

    color: "#336633"
  }
  
  // Road is basically cube but darker, and then we scaled it down to a slab when drawing
  let road = structuredClone(cube);
  road.color = "#222222";


   //light up a couple of pixels 
  setPixelColor(100,100,"#FFFFFF")
  setPixelColor(100,101,"#FFFFFF")
  setPixelColor(101,100,"#FFFFFF")
  setPixelColor(101,101,"#FFFFFF")
  setPixelColor(102,101,"#FFFFFF")

  // Global draw function for each object, in case we want to draw multiple
  function drawObject(obj, global_position, scale = [1, 1, 1]) {
    let projectedVertices = [];

    let scaledObj = structuredClone(obj);

    scaledObj.vertices.forEach(vertex => {
      vertex.x *= scale[0];
      vertex.y *= scale[1];
      vertex.z *= scale[2];
    });

    // If all vertices are behind the camera, don't draw the object
    if (global_position.z + Math.max(...scaledObj.vertices.map(v => v.z)) < camera.z) {
      return;
    }

    // For each vertices with z behind camera: 
    // Find the intersection between the camera plane and every edges from the point behind camera to the point in front of camera
    // and replace the point behind camera with that intersection point. May add some vertices/edges? 
    // i and j are expected behind and infront vertex
    for (let i = 0; i < scaledObj.vertices.length; i++) {
      let vertex = scaledObj.vertices[i];

      // Get vertices' world z to check if it's behind camera
      let worldZ = vertex.z + global_position.z;
      if (worldZ < camera.z - 0.001) { // Have the cutoff line a bit further than the camera to avoid screen clipping
        // Check each edge that include this vertex
        scaledObj.edges.forEach(edge => {
          if (edge.includes(i)) {
            let j = edge[0] === i ? edge[1] : edge[0];
            let otherVertex = scaledObj.vertices[j];

            // Check if the other vertex is in front of camera
            let otherWorldZ = otherVertex.z + global_position.z;
            if (otherWorldZ >= camera.z - 0.001) { // Similar to above
              let t = (camera.z - worldZ) / (otherWorldZ - worldZ);
              let intersection = {
                x: vertex.x + t * (otherVertex.x - vertex.x),
                y: vertex.y + t * (otherVertex.y - vertex.y),
                z: camera.z + 0.001 - global_position.z // I'm not gonna lie at this point I have no idea what I'm doing but it work
              };

              // Add intersection
              scaledObj.vertices.push(intersection);
              let newIndex = scaledObj.vertices.length - 1;

              // Replace the vertex behind camera with the intersection in the edge
              if (edge[0] === i) {
                edge[0] = newIndex;
              } else {
                edge[1] = newIndex;
              }

              console.log(intersection);
              console.log(scaledObj.edges);
            } else {
              // Both vertices are behind camera, remove the edge
              scaledObj.edges = scaledObj.edges.filter(e => e !== edge);
            }
          }
        });
      }
    };

    for(let v = 0; v < scaledObj.vertices.length; v++){
       //console.log("original position:");  //helpful to print things
       //console.log( scaledObj.vertices[v] );

       //console.log("camera-relative position");
       let camVert = {}; 
       // Get this by offsetting the v position by camera position
       camVert.x = scaledObj.vertices[v].x + global_position.x - camera.x; 
       camVert.y = scaledObj.vertices[v].y + global_position.y - camera.y; 
       camVert.z = scaledObj.vertices[v].z + global_position.z - camera.z; 
       //console.log( camVert );

       //console.log("projected position"); 
       let canvasPos = {};
       // Do the triangle formula thing to get the projected position on a base 1x1 2D plane (centered at 0, 0)
       canvasPos.u = camVert.x / camVert.z;  
       canvasPos.v = camVert.y / camVert.z;  
       //console.log( canvasPos );

       //console.log("scale and center"); 
       // Scale the 1x1 2D plane position to actual canvas size + centering it
       canvasPos.u = canvasPos.u * canvas.width + canvas.width/2;
       canvasPos.v = canvasPos.v * canvas.height + canvas.height/2;
       //console.log( canvasPos );

       projectedVertices.push(canvasPos);
       //console.log("---------------"); 

    }

    //loop through the edges
    //  find the newly computed projected vertices - 2 per edge
    //  draw the line
    for(let e = 0; e < scaledObj.edges.length; e++){
      console.log("Edge: " + scaledObj.edges[e]);
      //first vertex
      let e1 = scaledObj.edges[e][0]; //idx
      let u1 = projectedVertices[ e1 ].u; 
      let v1 = canvas.height - projectedVertices[ e1 ].v;

      //second vertex
      let e2 = scaledObj.edges[e][1]; //idx
      let u2 = projectedVertices[ e2 ].u;
      let v2 = canvas.height - projectedVertices[ e2 ].v;

      console.log("Camera Position: " + camera.x + ", " + camera.y + ", " + camera.z);
      console.log("Original Vertices: " + scaledObj.vertices[e1].x + ", " + scaledObj.vertices[e1].y + ", " + scaledObj.vertices[e1].z + " and " + scaledObj.vertices[e2].x + ", " + scaledObj.vertices[e2].y + ", " + scaledObj.vertices[e2].z);
      console.log("Projected Vertices: " + u1 + ", " + v1 + " and " + u2 + ", " + v2);

      // Just in case
      if (Math.abs(u1) === Infinity || Math.abs(u2) === Infinity || Math.abs(v1) === Infinity || Math.abs(v2) === Infinity) {
        console.log("Skipping line due to Infinity values");
        continue;
      }

      drawLine(u1, v1, u2, v2, scaledObj.color || "#FFFFFF");
    }
  }

  function draw(){
    //here we set up and clear the canvas, every draw frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Clear pixel color too
    for(let u = 0; u < cols; u++){
      for(let v = 0; v < rows; v++){
        pixelGrid[u][v] = "#050510";
      }
    }

    ctx.lineWidth = 1;
    ctx.strokeStyle = "#444444";

    drawObject(road, {x: 0, y: -0.005, z: 0}, [1, 0.01, 200]);

    // Mountain
    drawObject(square_mountain, {x: -20, y: 5, z: 10}, [5, 5, 5]);
    drawObject(square_mountain, {x: 10, y: 2, z: 20}, [2, 2, 2]);
    drawObject(square_mountain, {x: -12, y: 3, z: 30}, [5, 3, 5]);
    drawObject(triangle_mountain, {x: 6, y: 5, z: 40}, [2, 5, 2]);
    drawObject(triangle_mountain, {x: -8, y: 4, z: 50}, [5, 4, 2]);
    drawObject(square_mountain, {x: 8, y: 3, z: 60}, [1, 3, 5]);
    drawObject(triangle_mountain, {x: -6, y: 5, z: 70}, [3, 5, 3]);
    drawObject(square_mountain, {x: 4, y: 2, z: 80}, [1, 2, 2]);

    // Road line
    drawObject(cube, {x: 0, y: -0.0025, z: 0}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 10}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 20}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 30}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 40}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 50}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 60}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 70}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 80}, [0.1, 0.005, 2]);

    drawObject(light_post_left, {x: -1, y: 0.5, z: 4}, [0.5, 0.5, 0.5]);
    drawObject(light_post_right, {x: 1, y: 0.5, z: 4}, [0.5, 0.5, 0.5]);

    drawObject(light_post_left, {x: -1, y: 1, z: 0});
    drawObject(light_post_right, {x: 1, y: 1, z: 0});
    
    drawObject(light_post_left, {x: -1, y: 0.5, z: -4}, [0.5, 0.5, 0.5]);
    drawObject(light_post_right, {x: 1, y: 0.5, z: -4}, [0.5, 0.5, 0.5]);

    drawObject(light_post_left, {x: -1, y: 1, z: -8});
    drawObject(light_post_right, {x: 1, y: 1, z: -8});

    for(v=0; v< 200; v++){
      for(u=0; u<320; u++){
        //console.log(u);
        //console.log(v);
        //console.log(pixelGrid[u][v]);
        //console.log("----")

        ctx.fillStyle = pixelGrid[u][v];
        ctx.fillRect(u * CanvasScale, v*CanvasScale, CanvasScale, CanvasScale);

        if( seePixelOutline ){
          ctx.strokeRect(u*CanvasScale, v*CanvasScale, CanvasScale, CanvasScale);
        }
      }
    }
  }

  function drawLine(u, v, u2, v2, color = "#FFFFFF") {
    // Round down by CanvasScale
    u = Math.floor(u / CanvasScale);
    v = Math.floor(v / CanvasScale);
    u2 = Math.floor(u2 / CanvasScale);
    v2 = Math.floor(v2 / CanvasScale);

    let dx = Math.abs(u2 - u);
    let dy = Math.abs(v2 - v);
    let sx = (u < u2) ? 1 : -1;
    let sy = (v < v2) ? 1 : -1;

    let err = dx - dy;
    while (true) {
      if (u >= 0 && u < cols && v >= 0 && v < rows) {
        setPixelColor(u, v, color);
      }

      if (u === u2 && v === v2) break;
      let e2 = 2 * err;
      if (e2 > -dy) {
        err -= dy;
        u += sx;
      }
      if (e2 < dx) {
        err += dx;
        v += sy;
      }
    }
  }

  function setPixelColor(u,v,color){
    pixelGrid[u][v] = color; 
  }

  
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }

  
  // Dont use alternative event here because lag
    document.addEventListener("keydown", (event) => {
      console.log(`Initial press: ${event.key}`)
      event.preventDefault();
       switch (event.key) {
        case "w":
          //****TO DO: Change camera z position a go closer
          camera.z += 1;
          console.log("Up arrow pressed");
          draw();
          break;
        case "s":
          //****TO DO: Change camera z position go further away
          camera.z -= 1;
          console.log("Down arrow pressed");
          draw();
          break;
        case "a":
          //****TO DO: Change camera x position move left
          camera.x -= 1;
          console.log("Left arrow pressed");
          draw();
          break;
        case "d":
          //****TO DO: Change camera x position move right
          camera.x += 1;
          console.log("Right arrow pressed");
          draw();
          break;
        case "KeyR":
          //****TO DO: reset camera
          camera.x = 0;
          camera.y = 0;
          camera.z = -10;
          console.log("Reset");
          draw();
          break;

        case "r":
          // KeyR is not working for me for some reason, so I added this one too since it work
          camera.x = 0;
          camera.y = 0;
          camera.z = -10;
          console.log("Reset");
          draw();
          break;
          
        default:
          return; 
      
      }
    });

  //window.addEventListener("resize", resizeCanvas);
  //resizeCanvas();
  draw(); // Initial draw



</script>
</body>
