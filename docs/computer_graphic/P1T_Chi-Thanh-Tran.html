  // Global draw function for each object, in case we want to draw multiple
  function drawObject(obj, global_position, scale = [1, 1, 1], color_overwrite = "-1") {
    let projectedVertices = [];

    let scaledObj = structuredClone(obj);

    scaledObj.vertices.forEach(vertex => {
      vertex.x *= scale[0];
      vertex.y *= scale[1];
      vertex.z *= scale[2];
    });

    // If all vertices are behind the camera, don't draw the object
    if (global_position.z + Math.max(...scaledObj.vertices.map(v => v.z)) < camera.z) {
      return;
    }

    // For each vertices with z behind camera: 
    // Find the intersection between the camera plane and every edges from the point behind camera to the point in front of camera
    // and replace the point behind camera with that intersection point. May add some vertices/edges
    // i and j are expected behind and infront vertex
    for (let i = 0; i < scaledObj.vertices.length; i++) {
      let vertex = scaledObj.vertices[i];

      // Get vertices' world z to check if it's behind camera
      let worldZ = vertex.z + global_position.z;
      if (worldZ < camera.z - 0.001) { // Have the cutoff line a bit further than the camera to avoid screen clipping
        // Check each edge that include this vertex
        scaledObj.edges.forEach(edge => {
          if (edge.includes(i)) {
            let j = edge[0] === i ? edge[1] : edge[0];
            let otherVertex = scaledObj.vertices[j];

            // Check if the other vertex is in front of camera
            let otherWorldZ = otherVertex.z + global_position.z;
            if (otherWorldZ >= camera.z - 0.001) { // Similar to above
              let t = (camera.z - worldZ) / (otherWorldZ - worldZ);
              let intersection = {
                x: vertex.x + t * (otherVertex.x - vertex.x),
                y: vertex.y + t * (otherVertex.y - vertex.y),
                z: camera.z + 0.001 - global_position.z // I'm not gonna lie at this point I have no idea what I'm doing but it work
              };

              // Add intersection
              scaledObj.vertices.push(intersection);
              let newIndex = scaledObj.vertices.length - 1;

              // Replace the vertex behind camera with the intersection in the edge
              if (edge[0] === i) {
                edge[0] = newIndex;
              } else {
                edge[1] = newIndex;
              }

              // Check each triangle that include both the vertex behind the camera and the vertex being checked beforehand
              // Replace point behind camera with new intersected
              // THIS DOES NOT FIX EVERYTHING, BUT IT SHOULD FIX MOST
              scaledObj.triangles.forEach(triangle => {
                if (triangle.includes(i)) {
                    if (triangle[0] == i) triangle[0] = newIndex
                    if (triangle[1] == i) triangle[1] = newIndex
                    if (triangle[2] == i) triangle[2] = newIndex
                  }
              })

              //console.log(intersection);
              //console.log(scaledObj.edges);
            } else {
              // Both vertices are behind camera, remove the edge
              scaledObj.edges = scaledObj.edges.filter(e => e !== edge);
            }
          }
        });
      }
    };

    for(let v = 0; v < scaledObj.vertices.length; v++){
      //console.log("original position:");  //helpful to print things
      //console.log( scaledObj.vertices[v] );

      //console.log("camera-relative position");
      let camVert = {}; 
      // Get this by offsetting the v position by camera position
      camVert.x = scaledObj.vertices[v].x + global_position.x - camera.x; 
      camVert.y = scaledObj.vertices[v].y + global_position.y - camera.y; 
      camVert.z = scaledObj.vertices[v].z + global_position.z - camera.z; 
      //console.log( camVert );

      //console.log("projected position"); 
      let canvasPos = {};
      // Do the triangle formula thing to get the projected position on a base 1x1 2D plane (centered at 0, 0)
      canvasPos.u = camVert.x / camVert.z;  
      canvasPos.v = camVert.y / camVert.z;  
      //console.log( canvasPos );

      //console.log("scale and center"); 
      // Scale the 1x1 2D plane position to actual canvas size + centering it
      canvasPos.u = canvasPos.u * canvas.width + canvas.width/2;
      canvasPos.v = canvasPos.v * canvas.height + canvas.height/2;
      //console.log( canvasPos );

      projectedVertices.push(canvasPos);
      //console.log("---------------"); 
    }

      //console.log("Original Vertices: " + scaledObj.vertices[e1].x + ", " + scaledObj.vertices[e1].y + ", " + scaledObj.vertices[e1].z + " and " + scaledObj.vertices[e2].x + ", " + scaledObj.vertices[e2].y + ", " + scaledObj.vertices[e2].z);
      //console.log("Projected Vertices: " + u1 + ", " + v1 + " and " + u2 + ", " + v2);

    // Exclusive code to draw line of edges that are not in any triangle

      let inTriangle = false;

        if (scaledObj.triangles[tri].includes(e1) && scaledObj.triangles[tri].includes(e2)) {
          inTriangle = true;
          break;
        }
      }

      if (inTriangle) break;

      //first vertex
      let u1 = projectedVertices[ e1 ].u; 
      let v1 = canvas.height - projectedVertices[ e1 ].v;
      let z1 = scaledObj.vertices[e1].z + global_position.z - camera.z;

      //console.log("Original Vertices: " + scaledObj.vertices[e1].x + ", " + scaledObj.vertices[e1].y + ", " + scaledObj.vertices[e1].z + " and " + scaledObj.vertices[e2].x + ", " + scaledObj.vertices[e2].y + ", " + scaledObj.vertices[e2].z);

  function distanceToLine(u1, v1, u2, v2, u0, v0){
    // return the distance from the point u0,v0 to the line segment defined by u1,v1 and u2,v2
    // I got the formula here https://math.stackexchange.com/questions/2757318/distance-between-a-point-and-a-line-defined-by-2-points

    return Math.abs((v2-v1)*(u0-u1) - (u2-u1)*(v0-v1)) / Math.sqrt(Math.pow(v2-v1, 2) + Math.pow(u2-u1, 2));
  }

  function drawLine(u1, v1, u2, v2, z1, z2, color = "#FFFFFF"){

    //******** TO DO
    //use the algorithm in the slides to incrementally fill
    // in pixels going from u1,v1 to u2,v2
    // you can use 'setPixelColor'
    // note, you may need to handle 'cases'- ex.u1>u2 vs u2>u2 

    // Strategy:
    // uIter and vIter is use to handle different direction cases
    // Every loop, choose the three pixel around the current pixel, facing the direction of the line (1 at the corner, and 2 next to that corner)
    // Calculate the distance of each of those choice to the main line using math
    // Iterate toward the choice with the shortest distance

    // Round down by CanvasScale
    u1 = Math.floor(u1 / CanvasScale);
    v1 = Math.floor(v1 / CanvasScale);
    u2 = Math.floor(u2 / CanvasScale);
    v2 = Math.floor(v2 / CanvasScale);

    let uMove = u1
    let vMove = v1

    let uIter = u1 < u2 ? 1 : u1 > u2 ? -1 : 0
    let vIter = v1 < v2 ? 1 : v1 > v2 ? -1 : 0

    if (uMove >= 0 && uMove < cols && vMove >= 0 && vMove < rows) {
      setPixelColor(uMove, vMove, color, z1);
    }

    while (true) {
      if (uMove === u2 && vMove === v2) {
        return;
      }

      if (uMove === u2) {
        vMove += vIter;
      } 
      
      else if (vMove === v2) {
        uMove += uIter;
      }

      else {
        uMoveDistance = distanceToLine(u1, v1, u2, v2, uMove + uIter, vMove)
        vMoveDistance = distanceToLine(u1, v1, u2, v2, uMove, vMove + vIter)
        uvMoveDistance = distanceToLine(u1, v1, u2, v2, uMove + uIter, vMove + vIter)

        if (uvMoveDistance < uMoveDistance && uvMoveDistance < vMoveDistance) {
          uMove += uIter;
          vMove += vIter;
        } else if (uMoveDistance < vMoveDistance) {
          uMove += uIter;
        } else {
          vMove += vIter;
        }
      }
      
      if (uMove >= 0 && uMove < cols && vMove >= 0 && vMove < rows) {
        // Get z here
        let len = ((u2 - u1)^2 + (v2 - v1)^2) ^ (1/2) 
        let curLen = ((uMove - u1)^2 + (vMove - v1)^2) ^ (1/2)
        let z = z1 + (curLen / len) * (z2 - z1)
 
        setPixelColor(uMove, vMove, color, z);
      }
    }
  }

  function inTriangle(u1, v1, u2, v2, u3, v3, x, y){
    // Half-plane
    const d1 = (v1 - v2)*(x - u2) - (u1 - u2)*(y - v2);
    const d2 = (v2 - v3)*(x - u3) - (u2 - u3)*(y - v3);
    const d3 = (v3 - v1)*(x - u1) - (u3 - u1)*(y - v1);

    const negative = (d1 <= 0) && (d2 <= 0) && (d3 <= 0);
    const positive = (d1 >= 0) && (d2 >= 0) && (d3 >= 0);
    
    return (negative || positive);
  }

  function drawTriangle(u1, v1, u2, v2, u3, v3, z1, z2, z3, color = "#FFFFFF"){
    // Round down by CanvasScale
    u1 = Math.floor(u1 / CanvasScale);
    v1 = Math.floor(v1 / CanvasScale);
    u2 = Math.floor(u2 / CanvasScale);
    v2 = Math.floor(v2 / CanvasScale);
    u3 = Math.floor(u3 / CanvasScale);
    v3 = Math.floor(v3 / CanvasScale);

    min_u = Math.min(u1, u2, u3);
    max_u = Math.max(u1, u2, u3);
    min_v = Math.min(v1, v2, v3);
    max_v = Math.max(v1, v2, v3);


    // Just clip it to the biggest possible
    min_u = Math.max(min_u, 0);
    max_u = Math.min(max_u, 320);
    min_v = Math.max(min_v, 0);
    max_v = Math.min(max_v, 200);


    for(i = min_u; i < max_u; i++){
      for(j = min_v; j < max_v; j++){
        if (i < 0 || i >= cols || j < 0 || j >= rows) continue;
        
        if (inTriangle(u1, v1, u2, v2, u3, v3, i, j)) {
          // Get barycentric coordinate -> pixel depth
          const d = (v2 - v3)*(u1 - u3) + (u3 - u2)*(v1 - v3);
          const a = ((v2 - v3)*(i - u3) + (u3 - u2)*(j - v3)) / d;
          const b = ((v3 - v1)*(i - u3) + (u1 - u3)*(j - v3)) / d;
          const c = 1 - a - b
          const z = a*z1 + b*z2 + c*z3

          //console.log(u1, v1, u2, v2, u3, v3, i, j)
          setPixelColor(i, j, color, z);
        }
      }
    }

    return
  }


  function setPixelColor(u,v,color,z = 0){
    if (z < pixelDepth[u][v])
    { 
      pixelGrid[u][v] = color;
      pixelDepth[u][v] = z;
    } 
  }
