  // Road is basically cube but darker, and then we scaled it down to a slab when drawing

  let camera = {x: 0, y: 0.5, z: -12.01};

  // Global draw function for each object, in case we want to draw multiple
  function drawObject(obj, global_position, scale = [1, 1, 1]) {
    let projectedVertices = [];

    let scaledObj = structuredClone(obj);

    scaledObj.vertices.forEach(vertex => {
      vertex.x *= scale[0];
      vertex.y *= scale[1];
      vertex.z *= scale[2];
    });

    // If all vertices are behind the camera, don't draw the object
    if (global_position.z + Math.max(...scaledObj.vertices.map(v => v.z)) < camera.z) {
      return;
    }

    // For each vertices with z behind camera: 
    // Find the intersection between the camera plane and every edges from the point behind camera to the point in front of camera
    // and replace the point behind camera with that intersection point. May add some vertices/edges? 
    // i and j are expected behind and infront vertex
    for (let i = 0; i < scaledObj.vertices.length; i++) {
      let vertex = scaledObj.vertices[i];

      // Get vertices' world z to check if it's behind camera
      let worldZ = vertex.z + global_position.z;
      if (worldZ < camera.z - 0.00001) { // Have the cutoff line a bit further than the camera to avoid screen clipping
        // Check each edge that include this vertex
        scaledObj.edges.forEach(edge => {
          if (edge.includes(i)) {
            let j = edge[0] === i ? edge[1] : edge[0];
            let otherVertex = scaledObj.vertices[j];

            // Check if the other vertex is in front of camera
            let otherWorldZ = otherVertex.z + global_position.z;
            if (otherWorldZ >= camera.z - 0.00001) { // Similar to above
              let t = (camera.z - worldZ) / (otherWorldZ - worldZ);
              let intersection = {
                x: vertex.x + t * (otherVertex.x - vertex.x),
                y: vertex.y + t * (otherVertex.y - vertex.y),
                z: camera.z + 0.00001 - global_position.z // I'm not gonna lie at this point I have no idea what I'm doing but it work
              };

              // Add intersection
              scaledObj.vertices.push(intersection);
              let newIndex = scaledObj.vertices.length - 1;

              // Replace the vertex behind camera with the intersection in the edge
              if (edge[0] === i) {
                edge[0] = newIndex;
              } else {
                edge[1] = newIndex;
              }

              console.log(intersection);
              console.log(scaledObj.edges);
            } else {
              // Both vertices are behind camera, remove the edge
              scaledObj.edges = scaledObj.edges.filter(e => e !== edge);
            }
          }
        });
      }
    };

    for(let v = 0; v < scaledObj.vertices.length; v++){
       //console.log("original position:");  //helpful to print things
       //console.log( scaledObj.vertices[v] );

       //console.log("camera-relative position");
       let camVert = {}; 
       // Get this by offsetting the v position by camera position
       camVert.x = scaledObj.vertices[v].x + global_position.x - camera.x; 
       camVert.y = scaledObj.vertices[v].y + global_position.y - camera.y; 
       camVert.z = scaledObj.vertices[v].z + global_position.z - camera.z; 
       //console.log( camVert );

       //console.log("projected position"); 
       let canvasPos = {};
       // Do the triangle formula thing to get the projected position on a base 1x1 2D plane (centered at 0, 0)
       canvasPos.u = camVert.x / camVert.z;  
       canvasPos.v = camVert.y / camVert.z;  
       //console.log( canvasPos );

       //console.log("scale and center"); 
       // Scale the 1x1 2D plane position to actual canvas size + centering it
       canvasPos.u = canvasPos.u * canvas.width + canvas.width/2;
       canvasPos.v = canvasPos.v * canvas.height + canvas.height/2;
       //console.log( canvasPos );

       projectedVertices.push(canvasPos);
       //console.log("---------------"); 

    }

    // Choose color
    if (!scaledObj.color) {
      ctx.strokeStyle = "#FFFFFF"; // Default color
    } else {
      ctx.strokeStyle = scaledObj.color;
    }

    //loop through the edges
    //  find the newly computed projected vertices - 2 per edge
    //  draw the line
    for(let e = 0; e < scaledObj.edges.length; e++){
      console.log("Edge: " + scaledObj.edges[e]);
      //first vertex
      let e1 = scaledObj.edges[e][0]; //idx
      let u1 = projectedVertices[ e1 ].u; 
      let v1 = canvas.height - projectedVertices[ e1 ].v;

      //second vertex
      let e2 = scaledObj.edges[e][1]; //idx
      let u2 = projectedVertices[ e2 ].u;
      let v2 = canvas.height - projectedVertices[ e2 ].v;

      console.log("Camera Position: " + camera.x + ", " + camera.y + ", " + camera.z);
      console.log("Original Vertices: " + scaledObj.vertices[e1].x + ", " + scaledObj.vertices[e1].y + ", " + scaledObj.vertices[e1].z + " and " + scaledObj.vertices[e2].x + ", " + scaledObj.vertices[e2].y + ", " + scaledObj.vertices[e2].z);
      console.log("Projected Vertices: " + u1 + ", " + v1 + " and " + u2 + ", " + v2);

      // Just in case
      if (Math.abs(u1) === Infinity || Math.abs(u2) === Infinity || Math.abs(v1) === Infinity || Math.abs(v2) === Infinity) {
        console.log("Skipping line due to Infinity values");
        continue;
      }

      drawLine(u1, v1, u2, v2);
    }
  }

  function draw() {
    // clear the canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Horizon
    ctx.strokeStyle = "#444444";
    drawLine(0, canvas.height / 2, canvas.width, canvas.height / 2);

    // Draw objects from here
    //drawObject(cube, {x: 0, y: 0, z: 0});
    drawObject(road, {x: 0, y: -0.005, z: 0}, [1, 0.01, 200]);

    // Mountain
    drawObject(square_mountain, {x: -20, y: 5, z: 10}, [5, 5, 5]);
    drawObject(square_mountain, {x: 10, y: 2, z: 20}, [2, 2, 2]);
    drawObject(square_mountain, {x: -12, y: 3, z: 30}, [5, 3, 5]);
    drawObject(triangle_mountain, {x: 6, y: 5, z: 40}, [2, 5, 2]);
    drawObject(triangle_mountain, {x: -8, y: 4, z: 50}, [5, 4, 2]);
    drawObject(square_mountain, {x: 8, y: 3, z: 60}, [1, 3, 5]);
    drawObject(triangle_mountain, {x: -6, y: 5, z: 70}, [3, 5, 3]);
    drawObject(square_mountain, {x: 4, y: 2, z: 80}, [1, 2, 2]);

    // Road line
    drawObject(cube, {x: 0, y: -0.0025, z: 0}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 10}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 20}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 30}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 40}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 50}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 60}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 70}, [0.1, 0.005, 2]);
    drawObject(cube, {x: 0, y: -0.0025, z: 80}, [0.1, 0.005, 2]);

    drawObject(light_post_left, {x: -1, y: 0.5, z: 4}, [0.5, 0.5, 0.5]);
    drawObject(light_post_right, {x: 1, y: 0.5, z: 4}, [0.5, 0.5, 0.5]);

    drawObject(light_post_left, {x: -1, y: 1, z: 0});
    drawObject(light_post_right, {x: 1, y: 1, z: 0});
    
    drawObject(light_post_left, {x: -1, y: 0.5, z: -4}, [0.5, 0.5, 0.5]);
    drawObject(light_post_right, {x: 1, y: 0.5, z: -4}, [0.5, 0.5, 0.5]);

    drawObject(light_post_left, {x: -1, y: 1, z: -8});
    drawObject(light_post_right, {x: 1, y: 1, z: -8});
  }

  //This uses a built in 'drawLine' function, provided by the javascript canvas
  function drawLine(x1, y1, x2, y2){
    ctx.lineWidth = 2;

    //this is how you draw a line on the canvas 
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // Alternative logic to remove key held delay
  const keysPressed = {};

  window.addEventListener('keydown', (e) => {
    console.log(`Initial press: ${e.key}`)
    keysPressed[e.code] = true;
  });

  window.addEventListener('keyup', (e) => {
    keysPressed[e.code] = false;
  });

  // do nothing for now....
  document.addEventListener("keydown", (event) => {
    event.preventDefault();
    if (event.key === "KeyR" || event.key === "r") {
      console.log(`Initial press: ${event.key}`)
      //****TO DO: reset camera
      camera.x = 0;
      camera.y = 0;
      camera.z = -10;
      console.log("Reset");
      draw();
    }
  });

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }

  let speedScale = 1;

  function update() {
    if (keysPressed['ShiftLeft']) {
      speedScale = 5;
    } else {
      speedScale = 1;
    }

    if (keysPressed['KeyW']) {
      camera.z += 0.1 * speedScale;
      draw();
    }

    if (keysPressed['KeyS']) {
      camera.z -= 0.1 * speedScale;
      draw();
    }

    if (keysPressed['KeyA']) {
      camera.x -= 0.1;
      draw();
    }

    if (keysPressed['KeyD']) {
      camera.x += 0.1;
      draw();
    }
  }


  //window.addEventListener("resize", resizeCanvas);
  //resizeCanvas();

  draw();
  
  setInterval(update, 30);
