<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Rendering Algo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <b>Projection</b><br>
  </div>

<script>

  // Work by Chi Thanh Tran
  // Fully done alone, with support from given slides from the course

  //we add shapes (like lines) to this canvas
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  //an array of objects
  //    to access the first 'x' coordinate you could type vertices[0].x
  let vertices = [ 
    { x:  1,  y: 1,  z: 1},   // A, idx 0
    { x: -1,  y: 1,  z: 1},   // B, idx 1
    { x:  1,  y: -1, z: 1},   // C, idx 2
    { x: -1,  y: -1, z:  1},  // D, idx 3
    { x:  1,  y: 1,  z: -1},  // E, idx 4
    { x: -1,  y: 1,  z: -1},  // F, idx 5
    { x:  1,  y: -1, z:  -1}, // G, idx 6
    { x: -1,  y: -1, z: -1}   // H, idx 7
  ];

  // an array of the indics for the two vertices in each edge
  let edges = [
    [0, 1], //AB
    [0, 2], //AC
    [0, 4], //AE
    [2, 3], //CD
    [1, 3], //BD
    [2, 6], //CG
    [4, 5], //EF
    [4, 6], //EG
    [1, 5], //BF
    [6, 7], //GH
    [5, 7], //FH
    [3, 7], //DH
  ];


  let camera = {x: 0, y: 0, z: -10};


  function draw(){

    //here we set up and clear the canvas, every draw frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // here we will store u,v coordinates for the vertices, 
    // projected onto our 2d plane
    let projectedVertices = [];

    //- loop through the original vertices (X, Y, Z)
    //- and determine their position in 3D space relative to camera (x, y, z)
    //- then project them onto the 2D plane
    for(let v = 0; v< vertices.length; v++){   //  you could also write it foreach...
       console.log("original position:");  //helpful to print things
       console.log( vertices[v] );

       console.log("camera-relative position");
       let camVert = {}; 
       // Get this by offsetting the v position by camera position
       camVert.x = vertices[v].x - camera.x; //**** TO DO
       camVert.y = vertices[v].y - camera.y; //**** TO DO
       camVert.z = vertices[v].z - camera.z; //**** TO DO
       console.log( camVert );

       console.log("projected position"); 
       let canvasPos = {};
       // Do the triangle formula thing to get the projected position on a base 1x1 2D plane (centered at 0, 0)
       canvasPos.u = camVert.x / camVert.z; //**** TO DO  
       canvasPos.v = camVert.y / camVert.z; //**** TO DO 
       console.log( canvasPos );

       console.log("scale and center"); 
       // Scale the 1x1 2D plane position to actual canvas size + centering it
       canvasPos.u = canvasPos.u * canvas.width + canvas.width/2;
       canvasPos.v = canvasPos.v * canvas.height + canvas.height/2;
       console.log( canvasPos );

       projectedVertices.push(canvasPos);
       console.log("---------------"); 

    }

    //loop through the edges
    //  find the newly computed projected vertices - 2 per edge
    //  draw the line
    for(let e = 0; e < edges.length; e++){
      
      //first vertex
      let e1 = edges[e][0]; //idx
      let u1 = projectedVertices[ e1 ].u; 
      let v1 = canvas.height - projectedVertices[ e1 ].v;  //TO DO- explain why did I do this?

      // The reason for the subtraction on v1 is due to the resulting coordinate of projectedVertices being a flipped value
      // compared to the original coordinate given.
      // The original coordinate system (which is used by a lot of system, including Blender)
      // have positive xy value being top-right, while the coordinate system of JS canvas have the positive xy value being bottom-right. 
      // This is also why v1/y need to be flipped, but u1/x stay the same.
      // This is actually not noticable in the current example cube due to its symmetric nature, 
      // but will be noticable when changing certain value.

      // The same go for v2 below

      //second vertex
      let e2 = edges[e][1]; //idx
      let u2 = projectedVertices[ e2 ].u;
      let v2 = canvas.height - projectedVertices[ e2 ].v;  //TO DO- explain why did I do this?

      drawLine(u1, v1, u2, v2);
    }
  }


  //This uses a built in 'drawLine' function, provided by the javascript canvas
  function drawLine(x1, y1, x2, y2){
    ctx.lineWidth = 2;
    ctx.strokeStyle = "white";

    //this is how you draw a line on the canvas 
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }


  //this is how we detect events- 

  // do nothing for now....
    document.addEventListener("keydown", (event) => {
      console.log(`Initial press: ${event.key}`)
      event.preventDefault();
       switch (event.key) {
        case "ArrowUp":
          //****TO DO: Change camera z position a go closer
          camera.z += 1;
          console.log("Up arrow pressed");
          draw();
          break;
        case "ArrowDown":
          //****TO DO: Change camera z position go further away
          camera.z -= 1;
          console.log("Down arrow pressed");
          draw();
          break;
        case "ArrowLeft":
          //****TO DO: Change camera x position move left
          camera.x -= 1;
          console.log("Left arrow pressed");
          draw();
          break;
        case "ArrowRight":
          //****TO DO: Change camera x position move right
          camera.x += 1;
          console.log("Right arrow pressed");
          draw();
          break;
        case "KeyR":
          //****TO DO: reset camera
          camera.x = 0;
          camera.y = 0;
          camera.z = -10;
          console.log("Reset");
          draw();
          break;

        case "r":
          // KeyR is not working for me for some reason, so I added this one too since it work
          camera.x = 0;
          camera.y = 0;
          camera.z = -10;
          console.log("Reset");
          draw();
          break;
          
        default:
          return; 
      
      }
    });

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }


  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();



</script>
</body>
</html>
